<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Номера</title>
<style>
:root{--bg:#0b0b12;--c:#171722;--c2:#22222f;--t:#f2f2f7;--m:#8d8da0;--ac:#7c6cff;--g:#33d17a;--r:#ff5b6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
#hud{display:flex;gap:14px;align-items:center;padding:12px 18px 6px;font-weight:800;font-size:17px}
#hud small{display:block;color:var(--m);font-weight:500;font-size:11px}
#hud .sp{flex:1}
#view{flex:1;overflow-y:auto;padding:6px 18px 96px}
#nav{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:#1b1b27ee;border:1px solid #2c2c3c;border-radius:26px;padding:5px;backdrop-filter:blur(10px)}
#nav button{flex:1;background:none;border:0;color:var(--m);font-size:13px;padding:11px 0;border-radius:20px;font-weight:600}
#nav button.on{background:#34344a;color:var(--t)}
h1{font-size:30px;margin:10px 0 12px;letter-spacing:.5px}
.pl{display:flex;margin:14px auto 6px;width:min(100%,330px);height:84px;background:#f4f4f0;border:3px solid #222;border-radius:10px;color:#161616;font-weight:800;box-shadow:0 12px 40px #0008}
.pl .pn{flex:1;display:flex;align-items:center;justify-content:center;font-size:42px;letter-spacing:2px;white-space:nowrap}
.pl .pn i{font-style:normal;margin:0 3px}
.pl .pr{width:30%;border-left:3px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;line-height:1}
.pl .pr small{font-size:10px;margin-top:2px}
.pl.sm{width:150px;height:40px;margin:0;border-width:2px;border-radius:6px;box-shadow:none;flex:none}
.pl.sm .pn{font-size:20px;letter-spacing:1px}.pl.sm .pr{font-size:14px;border-left-width:2px}.pl.sm .pr small{font-size:6px}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.ctr{text-align:center}.rar{font-size:26px;font-weight:800;margin-top:8px}.price{font-size:44px;font-weight:900;margin:4px 0}
.mut{color:var(--m);font-size:13px}.tags{font-size:13px;color:var(--m);margin:6px 0;line-height:1.6}.tags b{color:#9d92ff}
.bar{height:5px;background:#2a2a3a;border-radius:3px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:#bdbdd0;border-radius:3px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:6px 0}
.btns{display:flex;gap:10px;margin:12px 0;align-items:stretch}
.btn{border:0;border-radius:22px;padding:14px 16px;background:#33334a;color:var(--t);font-size:15px;font-weight:700;flex:1}
.btn.big{background:#e8e8f0;color:#111;font-size:19px;padding:18px;flex:2}.btn.pr{background:var(--ac)}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4}.btn small{display:block;font-weight:500;opacity:.7;font-size:11px}
.card{background:var(--c);border:1px solid #262636;border-radius:20px;padding:14px 16px;margin:10px 0}
.card.g{background:linear-gradient(135deg,#2c6b62,#3f8f84)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #222233}
.item:last-child{border:0}.item .inf{flex:1;min-width:0}.item .inf b{display:block;font-size:14px}
.item .btn{flex:none;padding:9px 14px;font-size:13px}
.ov{position:absolute;inset:0;background:#000b;z-index:9;display:flex;align-items:flex-end}
.sheet{background:#14141e;width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.x{float:right;background:#2a2a3a;border:0;color:var(--t);width:34px;height:34px;border-radius:17px;font-size:16px}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fffe;color:#111;padding:10px 16px;border-radius:16px;font-size:14px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
#toast.on{opacity:1}
.wrap{position:relative;width:250px;height:250px;margin:14px auto 8px}
.wrap:before{content:"▼";position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:3;font-size:26px;color:#ffd24a}
#wh{position:absolute;inset:0;border-radius:50%;border:6px solid #2d2d3d;background:conic-gradient(#3a3a52 0 45deg,#5a3a8a 0 90deg,#3a3a52 0 135deg,#8a6a2a 0 180deg,#3a3a52 0 225deg,#5a3a8a 0 270deg,#3a3a52 0 315deg,#8a6a2a 0 360deg)}
#wh b{position:absolute;left:50%;top:50%;font-size:12px;width:70px;text-align:center}
.me{background:#2a2750;border-radius:12px;padding:6px 8px}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7c6cff,#33d1c4);margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
:root{--bg:#0a1730;--m:#a9c4e2;--ac:#6cc3ff}
html,body{background:linear-gradient(180deg,#07142b 0%,#0f2c52 55%,#1b4a78 100%) fixed}
#app{background:radial-gradient(circle at 50% -8%,#4a8fd566,transparent 55%)}
#snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#snow i{position:absolute;top:-14px;color:#fff;font-style:normal;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-5vh)}50%{transform:translate(22px,50vh)}100%{transform:translate(-12px,108vh)}}
#hud,#view{position:relative;z-index:1}
#nav{z-index:2;background:#12294ecc;border-color:#8fc4ff40}
#nav button{font-size:11px;line-height:1.35;padding:8px 0}
#nav button.on{background:linear-gradient(135deg,#5fb4ff,#9be6ff);color:#06203a}
.card{background:#ffffff14;border:1px solid #bfe3ff2e;backdrop-filter:blur(8px)}
.card.g{background:linear-gradient(135deg,#2a7fb8,#6ad0e8)}
.btn{background:#ffffff1f;border:1px solid #bfe3ff30}
.btn.big{background:linear-gradient(135deg,#fff,#bfe6ff);color:#082340;border:0;box-shadow:0 6px 24px #6cc3ff55}
.btn.pr{background:linear-gradient(135deg,#4aa8ff,#7fe0ff);color:#05203a;border:0}
.sheet{background:#0f2447f5;border:1px solid #8fc4ff30}
.x{background:#ffffff22}
.bar{background:#ffffff1f}.bar>div{background:linear-gradient(90deg,#6cc3ff,#d2f3ff)}
.me{background:#3b86d066}
.item{border-bottom-color:#ffffff1a}
h1{background:linear-gradient(90deg,#fff,#8fd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#wh{background:conic-gradient(#2d5f95 0 45deg,#6aa9e0 0 90deg,#2d5f95 0 135deg,#d9a93a 0 180deg,#2d5f95 0 225deg,#6aa9e0 0 270deg,#2d5f95 0 315deg,#d9a93a 0 360deg);border-color:#cfeaff}
.pn u{text-decoration:none;display:inline-block;width:.68em;text-align:center}
.pn u:nth-child(2),.pn u:nth-child(5){margin-left:.16em}
.pl.hi{border-color:var(--rc);box-shadow:0 0 0 2px #ffffff40,0 0 24px var(--rc),0 12px 40px #0008}
.pl.hi .pr{border-left-color:var(--rc)}
.pl.sm.hi{box-shadow:0 0 10px var(--rc)}
.chips{display:flex;gap:8px;margin:14px 0 0}
.chip{flex:1;padding:12px 0;border-radius:16px;border:1px solid #bfe3ff30;background:#ffffff14;color:var(--t);font-weight:800;font-size:15px}
.chip.on{background:linear-gradient(135deg,#4aa8ff,#7fe0ff);color:#05203a;border:0}.chip[disabled]{opacity:.5}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:2px;padding:12px 16px;border-radius:18px;border:1px solid #bfe3ff30;background:#ffffff14;color:var(--t);font-size:14px;font-weight:600}
.sw{width:42px;height:24px;border-radius:12px;background:#ffffff30;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#4aa8ff}.sw.on:after{left:21px}
/* v3: darker winter */
:root{--m:#8fa6c4}
html,body{background:linear-gradient(180deg,#050b18 0%,#0a1630 55%,#0e2243 100%) fixed}
#app{background:radial-gradient(circle at 50% -8%,#2a5f9a40,transparent 55%)}
#snow{opacity:.5}
#nav{background:#0b1730ee;border-color:#6f9fd433}
#nav button.on{background:linear-gradient(135deg,#2f6fb0,#4b9bc4);color:#eaf4ff}
.card{background:#ffffff0d;border-color:#9cc4f01f}
.card.g{background:linear-gradient(135deg,#1d4f7c,#2d7f94)}
.btn{background:#ffffff14;border-color:#9cc4f024}
.btn.big{background:linear-gradient(135deg,#b9d3ee,#86b3dc);color:#07182e;box-shadow:0 6px 20px #2a6fb040}
.btn.pr{background:linear-gradient(135deg,#2f74b8,#46a0c4);color:#eef7ff}
.chip.on{background:linear-gradient(135deg,#2f74b8,#46a0c4);color:#eef7ff}
.sheet{background:#0b1830f7}
.sw.on{background:#3c86c4}
.bar>div{background:linear-gradient(90deg,#3c86c4,#9fd0ea)}
h1{background:linear-gradient(90deg,#e4f0ff,#7fb4e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.me{background:#2f6fb04d}
input{user-select:text;-webkit-user-select:text}
.inp{width:100%;padding:13px;border-radius:14px;border:1px solid #9cc4f030;background:#ffffff10;color:var(--t);font-size:16px;margin-top:10px;outline:0}
/* links + promo */
.pro{display:flex;gap:8px;margin:6px 0 6px}
.pro button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:16px;border:1px solid #9cc4f030;background:#ffffff10;color:var(--t);font-weight:700;font-size:13px}
.pro .promo{border-color:#e9c46a77;background:linear-gradient(135deg,#e9c46a26,#ffffff08)}
.pro svg{width:22px;height:22px;flex:none}
/* 3D wheel */
.w3p{perspective:700px;margin:26px 0 20px}
.w3{position:relative;width:260px;height:260px;margin:0 auto;transform:rotateX(26deg)}
.w3:before{content:"";position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(#f4d98a,#a8741f,#f4d98a,#a8741f,#f4d98a);box-shadow:0 8px 0 #6b4a12,0 15px 0 #4a3209,0 28px 36px #000c}
.w3:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px dotted #fff3b0;pointer-events:none}
#wh{border:0;box-shadow:inset 0 0 0 5px #0b1830,inset 0 0 34px #000b}
#wh b{color:#fff;text-shadow:0 1px 3px #000;font-size:12px}
.w3 .gl{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 22%,#ffffff40,transparent 46%);pointer-events:none}
.w3 .ptr{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:30px;color:#ffd24a;z-index:3;filter:drop-shadow(0 3px 2px #000)}
.hub{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a7bb8,#0d2145 72%);border:4px solid #e9c46a;box-shadow:0 6px 0 #5a3d0e,0 12px 20px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.hub b{font-size:26px;line-height:1}.hub small{font-size:9px;letter-spacing:1px;color:#e9c46a;margin-top:2px}
/* top */
.avs{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#fff;box-shadow:0 4px 12px #0008}
.pod{display:flex;align-items:flex-end;gap:8px;margin:18px 0 12px}
.pc{flex:1;text-align:center;min-width:0}
.pc .cr{font-size:26px;height:30px}
.pc .pn2{font-size:13px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pv{font-size:12px;color:var(--m);margin-bottom:6px}
.pc .col{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:28px;font-weight:900;padding-top:8px;background:linear-gradient(180deg,#3c7fc4aa,#142e57aa);border:1px solid #9cc4f02a;border-bottom:0}
.pc.g1 .col{background:linear-gradient(180deg,#e9c46add,#7a5a1a88)}
.pc.g2 .col{background:linear-gradient(180deg,#c9d4e4cc,#55657e88)}
.pc.g3 .col{background:linear-gradient(180deg,#cd8a5acc,#6a3e1e88)}
.pc.me .avs{box-shadow:0 0 0 3px #6cc3ff,0 0 18px #6cc3ff88}
.lr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#ffffff0c;border:1px solid #9cc4f014;margin:7px 0}
.lr.mine{background:#2f6fb040;border-color:#6cc3ff66}
.lr .rk{width:22px;text-align:center;color:var(--m);font-size:14px}
.lr .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.lr .inf b{font-size:14px}
.lr .rt{text-align:right;font-size:13px}.lr .rt span{display:block;font-size:11px}
.up{color:#4ed08a}.dn{color:#ff6b7d}
.me2{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#2f6fb066,#46a0c433);border:1px solid #6cc3ff55;margin:8px 0}
/* casino */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{border:1px solid #9cc4f024;border-radius:20px;padding:16px 8px;background:linear-gradient(160deg,#ffffff14,#ffffff05);color:var(--t);text-align:center}
.gc:active{transform:scale(.97)}
.gc i{font-style:normal;font-size:38px;display:block;margin-bottom:6px}.gc b{display:block;font-size:16px}.gc span{font-size:11px;color:var(--m)}
.big3{font-size:58px;font-weight:900;text-align:center;margin:6px 0}
.win{color:#4ed08a}.lose{color:#ff6b7d}
.res{min-height:30px;margin:12px 0 4px;font-weight:800;font-size:16px;text-align:center}
.bets{display:flex;gap:6px;margin:8px 0}
.bets button{flex:1;padding:11px 0;border-radius:14px;border:1px solid #9cc4f024;background:#ffffff10;color:var(--t);font-size:13px;font-weight:700}
.bets button.on{background:#2f74b8}.bets button[disabled]{opacity:.4}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{aspect-ratio:1;border-radius:14px;border:1px solid #9cc4f024;background:#ffffff12;font-size:26px;color:var(--t)}
.tile.ok{background:#1f6f4a}.tile.bomb{background:#7a2230}
.dice{font-size:72px;letter-spacing:10px;text-align:center;margin:8px 0}
.coin{width:112px;height:112px;border-radius:50%;margin:12px auto;background:radial-gradient(circle at 35% 30%,#ffe59a,#b8862b);color:#4a3209;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:0 6px 0 #6b4a12,0 12px 24px #000a}
.flip{animation:flip .5s linear infinite}@keyframes flip{to{transform:rotateY(360deg)}}
.rkt{font-size:44px;text-align:center;height:70px;transition:transform .06s linear}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--m)}
.hist span{padding:3px 8px;border-radius:10px;background:#ffffff10}
/* profile */
.shd{position:absolute;right:-8px;bottom:-4px;font-size:28px}
.idb{display:block;margin:6px auto;padding:6px 14px;border-radius:14px;border:1px solid #9cc4f030;background:#ffffff0d;color:var(--t);font-size:13px}
.adm{border-color:#e9c46a66;background:linear-gradient(135deg,#e9c46a1f,#ffffff08)}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pk .btn{font-size:13px;padding:12px 8px}
/* v4 */
.pl{position:relative;overflow:hidden}
.pl.q0:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,#00000016 22px 23px,transparent 23px 47px,#00000010 47px 48px);pointer-events:none}
.pl.q1:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,#2f74b82a 10px 14px);pointer-events:none}
.pl.q2{filter:drop-shadow(0 0 7px #5b8cffcc)}
.pl.q3:after,.pl.q4:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffffcc,transparent);animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{to{left:130%}}
.pl.q4{border-color:transparent!important;background:linear-gradient(#f4f4f0,#f4f4f0) padding-box,linear-gradient(90deg,#ff4d6d,#ffb84d,#fff94d,#4dff88,#4dd2ff,#7c6cff,#ff4dd8,#ff4d6d) border-box;background-size:auto,300% 100%;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:0 0,300% 0}}
.chips.rg{margin-top:8px}
.chips.rg .chip{font-size:12px;padding:8px 0;line-height:1.25}
.pro a,.tgl2{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:16px;border:1px solid #9cc4f030;background:#ffffff10;color:var(--t);font-weight:700;font-size:13px;text-decoration:none}
.tgl2{margin-top:10px}.pro a svg,.tgl2 svg{width:22px;height:22px;flex:none}
.pfx{display:inline-block;font-weight:800;font-size:12px;padding:2px 9px;border-radius:10px;background:#ffffff12;border:1px solid #ffffff24;letter-spacing:.4px;white-space:nowrap}
.pfx span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.pfx3{display:inline-block;font-weight:900;font-size:22px;letter-spacing:4px;color:#ffe27a;transform:perspective(300px) rotateX(14deg);text-shadow:0 1px 0 #d9a21c,0 2px 0 #c0890f,0 3px 0 #a67208,0 4px 0 #8a5c05,0 5px 0 #6e4803,0 10px 12px #000b,0 0 22px #ffcf4a88;animation:fl 3s ease-in-out infinite;white-space:nowrap}
.pfx3.s{font-size:12px;letter-spacing:2px;text-shadow:0 1px 0 #c0890f,0 2px 0 #a67208,0 3px 0 #8a5c05,0 5px 6px #000b}
@keyframes fl{50%{transform:perspective(300px) rotateX(2deg) translateY(-2px)}}
.avu{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3c7fc4,#33a8b8);font-weight:800;color:#fff;flex:none;overflow:hidden;box-shadow:0 4px 14px #0008}
.avw{position:relative;width:84px;margin:12px auto 6px}
.edt{position:absolute;right:-6px;bottom:-2px;background:#2f74b8;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
.pk .btn .pfx,.pk .btn .pfx3{pointer-events:none}
/* v5 */
#hud{gap:10px;align-items:center;padding-right:12px}
#hs{font-weight:800}
.hb{position:relative;flex:none;width:36px;height:36px;border-radius:12px;border:1px solid #9cc4f030;background:#ffffff12;color:var(--t);font-size:17px;padding:0}
.hb i{position:absolute;top:-5px;right:-5px;background:#ff5b6e;color:#fff;font-size:10px;font-style:normal;border-radius:9px;min-width:16px;height:16px;line-height:16px;font-weight:800;display:none}
.pl.md{width:230px;height:60px;margin:10px auto 4px;border-width:2px;border-radius:8px}
.pl.md .pn{font-size:30px;letter-spacing:1px}.pl.md .pr{font-size:21px;border-left-width:2px}.pl.md .pr small{font-size:7px}
/* top v5 */
.th{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,#17406a,#1f5a82 60%,#26708a);border:1px solid #9cc4f033;margin:8px 0 12px;box-shadow:0 10px 30px #0006}
.th b{font-size:20px}.th small{display:block;color:#b5d6ee;font-size:12px;margin-top:2px}
.th .rkp{background:#00000045;border-radius:16px;padding:8px 14px;text-align:center;font-weight:900;font-size:22px;min-width:84px}.th .rkp small{font-size:10px;font-weight:600}
.srch{display:flex;gap:8px;margin:6px 0 4px}
.pod2{display:flex;align-items:flex-end;gap:8px;margin:12px 0 16px;padding:14px 8px 0;border-radius:24px;background:radial-gradient(ellipse at 50% 0,#3b7bc033,transparent 70%)}
.p2{flex:1;min-width:0;text-align:center;cursor:pointer}
.p2 .crown{font-size:24px;height:28px;filter:drop-shadow(0 0 8px #ffcf4a)}
